services:
  db:
    image: postgres:16
    container_name: vitral-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-vitral_db}
      POSTGRES_USER: ${POSTGRES_USER:-vitral_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    ports:
      - "5432:5432"
    volumes:
      - vitral_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vitral_user} -d ${POSTGRES_DB:-vitral_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vitral-backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-vitral_db}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-vitral_user}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-86400000}
      APP_UPLOAD_IMAGE_DIR: /data/uploads/images
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173,http://localhost:4173,http://127.0.0.1:4173,http://localhost:3000,http://127.0.0.1:3000}
      APP_URL_BASE: ${APP_URL_BASE:-http://localhost:8080}
      APP_URL_FRONTEND: ${APP_URL_FRONTEND:-http://localhost:5173}
      APP_SUPPORT_EMAIL: ${APP_SUPPORT_EMAIL:-vitral.no.reply@gmail.com}
      APP_MAIL_ENABLED: ${APP_MAIL_ENABLED:-true}
      SPRING_MAIL_HOST: ${SPRING_MAIL_HOST:-smtp.gmail.com}
      SPRING_MAIL_PORT: ${SPRING_MAIL_PORT:-587}
      SPRING_MAIL_USERNAME: ${SPRING_MAIL_USERNAME:-vitral.no.reply@gmail.com}
      SPRING_MAIL_PASSWORD: ${SPRING_MAIL_PASSWORD:-gcvjlmovuwlyveez}
      SERVER_PORT: 8080
    ports:
      - "${SERVER_PORT:-8080}:8080"
    volumes:
      - vitral_uploads:/data/uploads

volumes:
  vitral_data:
  vitral_uploads:

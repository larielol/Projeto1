server.port=8081

spring.datasource.url=jdbc:h2:mem:vitral_e2e;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;NON_KEYWORDS=ACCOUNT
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.defer-datasource-initialization=true
spring.jpa.show-sql=false
spring.flyway.enabled=false

spring.sql.init.mode=always
spring.sql.init.data-locations=classpath:db/e2e/data.sql

spring.devtools.restart.enabled=false
app.mail.enabled=false
app.url.base=http://127.0.0.1:8081

jwt.secret=${JWT_SECRET:MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=}
jwt.expiration=${JWT_EXPIRATION:86400000}

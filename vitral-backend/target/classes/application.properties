spring.application.name=vitral-backend

# ===== BANCO DE DADOS =====
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/vitral_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:vitral_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${POSTGRES_PASSWORD}}
spring.datasource.driver-class-name=org.postgresql.Driver

# ===== JPA / HIBERNATE =====
# Flyway gerencia o schema; Hibernate apenas valida que o mapeamento bate com o banco.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ===== FLYWAY =====
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# ===== CORS =====
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:4173,http://127.0.0.1:4173,http://localhost:3000,http://127.0.0.1:3000}

# ===== UPLOADS =====
app.upload.image-dir=${APP_UPLOAD_IMAGE_DIR:uploads/images}
app.upload.document-dir=${APP_UPLOAD_DOCUMENT_DIR:uploads/documents}
app.upload.document-max-size-bytes=${APP_UPLOAD_DOCUMENT_MAX_SIZE_BYTES:10485760}
spring.servlet.multipart.max-file-size=${APP_UPLOAD_MAX_FILE_SIZE:5MB}
spring.servlet.multipart.max-request-size=${APP_UPLOAD_MAX_REQUEST_SIZE:10MB}

# ===== SWAGGER / OPENAPI =====
springdoc.swagger-ui.path=/swagger-ui.html

# ===== SERVIDOR =====
# PORT vem primeiro porque plataformas de deploy (Render, Heroku, Railway) injetam essa
# variavel e exigem que a aplicacao escute exatamente nela. SERVER_PORT continua valendo
# para ambientes proprios e o 8080 permanece como default local.
server.port=${PORT:${SERVER_PORT:8080}}
server.forward-headers-strategy=${SERVER_FORWARD_HEADERS_STRATEGY:framework}

# ===== JWT =====
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}

# ===== E-MAIL =====
app.mail.enabled=${APP_MAIL_ENABLED:true}
app.url.base=${APP_URL_BASE:http://localhost:8080}
app.url.frontend=${APP_URL_FRONTEND:http://localhost:5173}
app.support.email=${APP_SUPPORT_EMAIL:vitral.no.reply@gmail.com}

# ===== BOOTSTRAP ADMIN (sem credenciais padrao) =====
app.bootstrap-admin.email=${APP_BOOTSTRAP_ADMIN_EMAIL:}
app.bootstrap-admin.password=${APP_BOOTSTRAP_ADMIN_PASSWORD:}
app.bootstrap-admin.name=${APP_BOOTSTRAP_ADMIN_NAME:Administrador}

# ===== MOCK TEMPORARIO DE VERIFICACAO DE SEBO =====
# Enquanto nao existe uma conta ADMIN para revisar cadastros manualmente
# (ver VerificacaoSeboService.revisar), o sebo e aprovado (VERIFICADO) automaticamente
# no cadastro/edicao/reenvio de documento. Defina como false assim que houver um ADMIN
# operando, para que o fluxo real de analise manual volte a valer.
app.sebo-verificacao.mock-auto-aprovar=${APP_SEBO_VERIFICACAO_MOCK_AUTO_APROVAR:true}

# ===== CONSULTA CNPJ SERPRO =====
app.cnpj-consulta.enabled=${APP_CNPJ_CONSULTA_ENABLED:false}
app.cnpj-consulta.token-url=${APP_CNPJ_TOKEN_URL:https://gateway.apiserpro.serpro.gov.br/token}
app.cnpj-consulta.consulta-url=${APP_CNPJ_CONSULTA_URL:https://gateway.apiserpro.serpro.gov.br/consulta-cnpj-df/v2/basica/{cnpj}}
app.cnpj-consulta.client-id=${APP_CNPJ_CLIENT_ID:}
app.cnpj-consulta.client-secret=${APP_CNPJ_CLIENT_SECRET:}
# MOCK (ainda nao existe integracao SERPRO configurada): quando a consulta automatica nao
# esta disponivel, considera o CNPJ ativo em vez de travar a aprovacao (VerificacaoSeboService.revisar
# exige statusConsultaCnpj=ATIVA). Defina como false assim que a integracao oficial for configurada.
app.cnpj-consulta.mock-auto-aprovar=${APP_CNPJ_CONSULTA_MOCK_AUTO_APROVAR:true}

# ===== GEOCODING (endereco -> lat/lng via Nominatim/OpenStreetMap, usado para ordenar sebos por proximidade) =====
# A consulta por CEP via BrasilAPI foi trocada pelo Nominatim (busca por endereco completo)
# porque a BrasilAPI vinha retornando "coordinates":{} vazio mesmo para enderecos conhecidos.
app.geocoding.enabled=${APP_GEOCODING_ENABLED:true}
app.geocoding.search-url=${APP_GEOCODING_SEARCH_URL:https://nominatim.openstreetmap.org/search?format=json&limit=1&countrycodes=br&q={q}}
app.geocoding.user-agent=${APP_GEOCODING_USER_AGENT:VitralApp/1.0 (MVP academico UFCG; sem contato publico)}

# ===== METADADOS DE PRODUTO (autopreenchimento do cadastro a partir do titulo) =====
# Open Library e MusicBrainz sao gratuitas e nao exigem chave, apenas User-Agent identificando a aplicacao.
# O Google Books foi descartado: sem chave a cota anonima e zero (HTTP 429).
app.metadados.enabled=${APP_METADADOS_ENABLED:true}
app.metadados.user-agent=${APP_METADADOS_USER_AGENT:VitralApp/1.0 (MVP academico UFCG; sem contato publico)}
app.metadados.limite-por-fonte=${APP_METADADOS_LIMITE_POR_FONTE:3}
app.metadados.open-library-search-url=${APP_METADADOS_OPEN_LIBRARY_SEARCH_URL:https://openlibrary.org/search.json?q={q}&limit={limit}&fields=key,title,author_name,first_publish_year,cover_i,subject}
app.metadados.open-library-work-url=${APP_METADADOS_OPEN_LIBRARY_WORK_URL:https://openlibrary.org{key}.json}
app.metadados.open-library-cover-url=${APP_METADADOS_OPEN_LIBRARY_COVER_URL:https://covers.openlibrary.org/b/id/{id}-L.jpg}
app.metadados.music-brainz-search-url=${APP_METADADOS_MUSIC_BRAINZ_SEARCH_URL:https://musicbrainz.org/ws/2/release/?query={q}&fmt=json&limit={limit}}
# A Wikipedia fornece o resumo do produto (o MusicBrainz nao tem sinopse e nem todo livro tem resumo na Open Library).
app.metadados.wikipedia-search-url=${APP_METADADOS_WIKIPEDIA_SEARCH_URL:https://pt.wikipedia.org/w/api.php?action=query&format=json&prop=extracts&exintro=1&explaintext=1&redirects=1&generator=search&gsrsearch={q}&gsrlimit=1}

# ===== RECOMENDACOES =====
app.recomendacao.historico-maximo=${APP_RECOMENDACAO_HISTORICO_MAXIMO:1000}
app.recomendacao.candidatos-maximo=${APP_RECOMENDACAO_CANDIDATOS_MAXIMO:200}
app.recomendacao.tamanho-home=${APP_RECOMENDACAO_TAMANHO_HOME:20}
app.recomendacao.retencao-termo-dias=${APP_RECOMENDACAO_RETENCAO_TERMO_DIAS:30}
app.recomendacao.retencao-evento-dias=${APP_RECOMENDACAO_RETENCAO_EVENTO_DIAS:365}
app.recomendacao.janela-visualizacao-minutos=${APP_RECOMENDACAO_JANELA_VISUALIZACAO_MINUTOS:30}
app.recomendacao.eventos-repetidos-dia-maximo=${APP_RECOMENDACAO_EVENTOS_REPETIDOS_DIA_MAXIMO:3}
app.recomendacao.compra-recente-dias=${APP_RECOMENDACAO_COMPRA_RECENTE_DIAS:90}
app.recomendacao.tamanho-pagina-maximo=${APP_RECOMENDACAO_TAMANHO_PAGINA_MAXIMO:50}
app.recomendacao.popularidade-dias=${APP_RECOMENDACAO_POPULARIDADE_DIAS:90}

spring.mail.host=${SPRING_MAIL_HOST:smtp.gmail.com}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:vitral.no.reply@gmail.com}
# Sem default: a senha de app do Gmail e um segredo e nao deve ficar versionada.
# Defina SPRING_MAIL_PASSWORD no ambiente (Render/local) para o envio de e-mail funcionar.
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SPRING_MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SPRING_MAIL_STARTTLS_ENABLE:true}
spring.mail.properties.mail.smtp.starttls.required=${SPRING_MAIL_STARTTLS_REQUIRED:true}

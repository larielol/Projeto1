# Perfil de teste: banco H2 em memoria, schema carregado por schema.sql (AGENTS.md).
spring.datasource.url=jdbc:h2:mem:vitral_test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false

# Flyway desligado em teste; o schema vem de schema.sql.
spring.flyway.enabled=false

# Envio de e-mail sempre desligado em teste (nao acessa SMTP real).
app.mail.enabled=false

# Sugestao de metadados desligada em teste: nenhum teste deve chamar Open Library / MusicBrainz de verdade.
app.metadados.enabled=false

# Mock de auto-aprovacao de sebo desligado em teste: os testes exercitam o fluxo real de verificacao.
app.sebo-verificacao.mock-auto-aprovar=false

# Mock de consulta de CNPJ tambem desligado em teste, pelo mesmo motivo.
app.cnpj-consulta.mock-auto-aprovar=false
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql

jwt.secret=${JWT_SECRET:MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=}
jwt.expiration=${JWT_EXPIRATION:86400000}

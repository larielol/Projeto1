<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" role="img" aria-labelledby="title desc">
  <title id="title">Vitral Sebo</title>
  <desc id="desc">Selo circular do Vitral com vitral, livro aberto e disco.</desc>
  <defs>
    <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#2d281d" flood-opacity="0.14"/>
    </filter>
    <path id="top-arc" d="M67 77a72 72 0 0 1 106 0"/>
    <path id="bottom-arc" d="M68 188a68 68 0 0 0 104 0"/>
  </defs>

  <circle cx="120" cy="120" r="96" fill="#fffaf0" stroke="#292619" stroke-width="5"/>

  <text font-family="Georgia, 'Times New Roman', serif" font-size="22" font-weight="700" fill="#292619" letter-spacing="1.8">
    <textPath href="#top-arc" startOffset="50%" text-anchor="middle">VITRAL</textPath>
  </text>

  <g transform="translate(80 76)" stroke="#292619" stroke-linejoin="round" stroke-linecap="round">
    <path d="M11 26 34 9l16 34Z" fill="#d45b45" stroke-width="3.2"/>
    <path d="M46 8h25L58 47Z" fill="#e5bd4e" stroke-width="3.2"/>
    <path d="M82 9 107 22 75 45Z" fill="#5f9f79" stroke-width="3.2"/>
    <path d="M32 45 50 35l-7 28Z" fill="#74a9a3" stroke-width="3.2"/>
    <path d="M58 50 81 37l-7 31Z" fill="#e5bd4e" stroke-width="3.2"/>
  </g>

  <g transform="translate(136 101)">
    <circle cx="25" cy="25" r="22" fill="#292619"/>
    <circle cx="25" cy="25" r="15" fill="none" stroke="#4a4232" stroke-width="3"/>
    <circle cx="25" cy="25" r="7" fill="#f7f1e5"/>
    <circle cx="25" cy="25" r="2.3" fill="#292619"/>
  </g>

  <g filter="url(#soft-shadow)" transform="translate(60 106)">
    <path d="M12 22c18-7 36-5 58 6v40c-20-9-38-10-58-4Z" fill="#f3dfaf" stroke="#292619" stroke-width="4" stroke-linejoin="round"/>
    <path d="M70 28c21-10 38-11 58-6v42c-20-7-38-6-58 4Z" fill="#f1d89c" stroke="#292619" stroke-width="4" stroke-linejoin="round"/>
    <path d="M70 28v40" fill="none" stroke="#292619" stroke-width="3" stroke-linecap="round"/>
    <path d="M24 39c11-3 23-2 33 2M24 51c11-3 23-2 33 2M82 41c11-4 23-5 34-2M82 53c11-4 23-5 34-2" fill="none" stroke="#8d7a47" stroke-width="2.4" stroke-linecap="round"/>
  </g>

  <text font-family="Inter, Arial, sans-serif" font-size="11" font-weight="800" fill="#5d6b36" letter-spacing="1.15">
    <textPath href="#bottom-arc" startOffset="50%" text-anchor="middle">SEBO VIRTUAL</textPath>
